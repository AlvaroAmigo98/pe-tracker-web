<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log out · RaiseTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% include "tracker/_theme.html" %}
  <style>.corner { position: fixed; top: 18px; right: 18px; z-index: 5; }</style>
</head>
<body>
  <div class="corner">{% include "tracker/_theme_toggle.html" %}</div>
  <div class="rt-shell">
    <div class="rt-panel">
      <div class="rt-brand-row">{% include "tracker/_brand.html" with size=32 wf=18 %}</div>
      <div class="rt-card" style="text-align:center">
        <h1 style="text-align:center">Log out of RaiseTrack?</h1>
        <p class="rt-sub" style="text-align:center">
          You’re signed in as <strong style="color:var(--text-1)">{{ request.user.username }}</strong>.
          You’ll need to sign in again to get back to your dashboard.
        </p>
        <form method="post" action="{% url 'logout' %}" style="margin:0">
          {% csrf_token %}
          <button class="rt-btn" type="submit">Log out</button>
        </form>
        <a class="rt-btn rt-btn-ghost" href="{% url 'dashboard' %}" style="margin-top:10px">Cancel</a>
      </div>
    </div>
  </div>
</body>
</html>
